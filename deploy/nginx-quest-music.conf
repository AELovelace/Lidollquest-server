# Publishes LiDollQuest served music: https://lidoll.dev/quest-music/<id>.mp3|.ogg -> quest server GET /music/<id>.<ext>.
# Include INSIDE the lidoll.dev HTTPS server block (next to the existing /gm and nginx-quest-gzip.conf includes):
#
#     include /etc/nginx/snippets/nginx-quest-music.conf;
#
# UPSTREAM: proxy_pass below assumes this proxy reaches the quest service at 10.1.1.24:4191, the same way the existing
# /gm location does. The service binds HOST from /etc/lidollquest/server.env (default 127.0.0.1 = local only); if /gm
# reaches it some other way, copy that location's proxy_pass address here instead.
# Needs the cache zone from nginx-quest-music-cache.conf (HTTP context). The game page loads songs from this same origin:
# the browser build plays the mp3 in an <audio> element, desktop builds download the ogg once into their save folder.
# proxy_cache_lock collapses a crowd hearing a new song at once into ONE fetch from the quest server; nginx then serves
# byte ranges (Safari, seeking) from its cached copy. The quest server already sends immutable one-year cache headers.
# Also check: if the /game/ page sends a Content-Security-Policy, it must allow `media-src 'self'`.
#
# Song uploads from the GM panel: the general /gm location keeps nginx's 1 MB body limit and a short read timeout, so
# the second block below gives the upload route room for a 50 MB file and up to three minutes of ffmpeg conversion.
# Put it in the SAME server block as your existing `location /gm` and keep its proxy settings identical to that block
# (address, Origin clearing, forwarded headers); only the size and timeout differ.

location ^~ /quest-music/ {
    proxy_pass http://10.1.1.24:4191/music/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_cache quest_music;
    proxy_cache_valid 200 206 14d;
    proxy_cache_valid 404 1m;               # an unknown id is retried soon (e.g. right after an upload deploys)
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    proxy_cache_use_stale updating error timeout;
    proxy_ignore_headers Set-Cookie;
    limit_except GET HEAD { deny all; }     # read-only
    client_max_body_size 1k;
    add_header X-Cache-Status $upstream_cache_status always;
}

location = /gm/music/upload {
    proxy_pass http://10.1.1.24:4191;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Origin            "";       # same as the /gm location: the panel is same-origin to itself
    client_max_body_size 50m;                    # QUEST_MUSIC_MAX_UPLOAD_MB
    proxy_read_timeout 200s;                     # ffmpeg converts before the reply (server timeout: 180 s)
    proxy_request_buffering on;
}
