# Disk cache for LiDollQuest served music (/quest-music/). Install on the nginx proxy (10.1.1.20) in the HTTP context,
# e.g. as /etc/nginx/conf.d/nginx-quest-music-cache.conf, then include nginx-quest-music.conf inside the lidoll.dev
# HTTPS server block. Song files are named by content hash and never change, so caching them is always safe.
#
#   sudo mkdir -p /var/cache/nginx/quest-music && sudo chown nginx:nginx /var/cache/nginx/quest-music
#   sudo nginx -t && sudo systemctl reload nginx
#
# Takedown (a deleted upload stays cached until it goes 14 days unrequested):
#   sudo rm -rf /var/cache/nginx/quest-music/* && sudo systemctl reload nginx

proxy_cache_path /var/cache/nginx/quest-music levels=1:2 keys_zone=quest_music:10m max_size=2g inactive=14d use_temp_path=off;
