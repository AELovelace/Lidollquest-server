<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img"><title>Map tools: three ways to commit a change</title><rect x="0" y="0" width="1120" height="580" rx="0" fill="#181324" stroke="none"/><text x="32" y="46" font-family="Arial,sans-serif" font-size="28" fill="#f4edf9">Map tools: three ways to commit a change</text><text x="32" y="77" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">Illustrative diagram • not a live map or editor screenshot</text><rect x="32" y="116" width="310" height="65" rx="10" fill="#30263d" stroke="#77bbff"/><text x="50" y="156" font-family="Arial,sans-serif" font-size="23" fill="#77bbff">Terrain / scenery</text><rect x="403" y="116" width="310" height="65" rx="10" fill="#30263d" stroke="#77bbff"/><text x="421" y="156" font-family="Arial,sans-serif" font-size="23" fill="#77bbff">Pending changes</text><rect x="774" y="116" width="310" height="65" rx="10" fill="#30263d" stroke="#77bbff"/><text x="792" y="156" font-family="Arial,sans-serif" font-size="23" fill="#77bbff">Apply changes</text><text x="353" y="158" font-family="Arial,sans-serif" font-size="32" fill="#f4edf9">→</text><text x="724" y="158" font-family="Arial,sans-serif" font-size="32" fill="#f4edf9">→</text><text x="32" y="217" font-family="Arial,sans-serif" font-size="20" fill="#c1b6d0">Undo / Redo / Discard affect this queue.</text><rect x="32" y="251" width="310" height="65" rx="10" fill="#30263d" stroke="#ffdc3c"/><text x="50" y="291" font-family="Arial,sans-serif" font-size="23" fill="#ffdc3c">NPC routes</text><rect x="403" y="251" width="310" height="65" rx="10" fill="#30263d" stroke="#ffdc3c"/><text x="421" y="291" font-family="Arial,sans-serif" font-size="23" fill="#ffdc3c">Waypoints + settings</text><rect x="774" y="251" width="310" height="65" rx="10" fill="#30263d" stroke="#ffdc3c"/><text x="792" y="291" font-family="Arial,sans-serif" font-size="23" fill="#ffdc3c">Save routes</text><text x="353" y="293" font-family="Arial,sans-serif" font-size="32" fill="#f4edf9">→</text><text x="724" y="293" font-family="Arial,sans-serif" font-size="32" fill="#f4edf9">→</text><text x="32" y="352" font-family="Arial,sans-serif" font-size="20" fill="#c1b6d0">Route drafts are separate from terrain patches.</text><rect x="32" y="386" width="310" height="65" rx="10" fill="#30263d" stroke="#7fe0c0"/><text x="50" y="426" font-family="Arial,sans-serif" font-size="23" fill="#7fe0c0">Place content</text><rect x="403" y="386" width="310" height="65" rx="10" fill="#30263d" stroke="#7fe0c0"/><text x="421" y="426" font-family="Arial,sans-serif" font-size="23" fill="#7fe0c0">Choose content + tile</text><rect x="774" y="386" width="310" height="65" rx="10" fill="#30263d" stroke="#7fe0c0"/><text x="792" y="426" font-family="Arial,sans-serif" font-size="23" fill="#7fe0c0">Click to commit</text><text x="353" y="428" font-family="Arial,sans-serif" font-size="32" fill="#f4edf9">→</text><text x="724" y="428" font-family="Arial,sans-serif" font-size="32" fill="#f4edf9">→</text><text x="32" y="487" font-family="Arial,sans-serif" font-size="20" fill="#c1b6d0">A placement is live immediately after a valid click.</text></svg>
