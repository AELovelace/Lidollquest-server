<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img"><title>Choose a movement pattern</title><rect x="0" y="0" width="1120" height="580" rx="0" fill="#181324" stroke="none"/><text x="32" y="46" font-family="Arial,sans-serif" font-size="28" fill="#f4edf9">Choose a movement pattern</text><text x="32" y="77" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">Illustrative diagram • not a live map or editor screenshot</text><rect x="24" y="108" width="1072" height="116" rx="12" fill="#282334" stroke="none"/><text x="44" y="142" font-family="Arial,sans-serif" font-size="23" fill="#7fe0c0">Loop</text><text x="355" y="145" font-family="Arial,sans-serif" font-size="29" fill="#ffdc3c">1 → 2 → 3 → 1 → 2 → 3 …</text><text x="355" y="185" font-family="Arial,sans-serif" font-size="19" fill="#f4edf9">Return to the first waypoint, not automatically to home.</text><rect x="24" y="241" width="1072" height="116" rx="12" fill="#282334" stroke="none"/><text x="44" y="275" font-family="Arial,sans-serif" font-size="23" fill="#7fe0c0">Back and forth</text><text x="355" y="278" font-family="Arial,sans-serif" font-size="29" fill="#ffdc3c">1 → 2 → 3 → 2 → 1 → 2 …</text><text x="355" y="318" font-family="Arial,sans-serif" font-size="19" fill="#f4edf9">Reverse the waypoint order at each end.</text><rect x="24" y="374" width="1072" height="116" rx="12" fill="#282334" stroke="none"/><text x="44" y="408" font-family="Arial,sans-serif" font-size="23" fill="#7fe0c0">Walk there and stay</text><text x="355" y="411" font-family="Arial,sans-serif" font-size="29" fill="#ffdc3c">1 → 2 → 3 → HOLD</text><text x="355" y="451" font-family="Arial,sans-serif" font-size="19" fill="#f4edf9">Remain at the final destination while this route is active.</text><text x="32" y="538" font-family="Arial,sans-serif" font-size="18" fill="#c1b6d0">Always / active Daily patterns. Interval schedules end after one traversal, then return home.</text></svg>
