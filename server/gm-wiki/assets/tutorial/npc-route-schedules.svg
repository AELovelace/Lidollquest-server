<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" role="img"><title>UTC schedules: windows, priority and interval boundaries</title><rect x="0" y="0" width="1120" height="580" rx="0" fill="#181324" stroke="none"/><text x="32" y="46" font-family="Arial,sans-serif" font-size="28" fill="#f4edf9">UTC schedules: windows, priority and interval boundaries</text><text x="32" y="77" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">Illustrative diagram • not a live map or editor screenshot</text><text x="276.0" y="122" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">00:00</text><text x="468.5" y="122" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">06:00</text><text x="532.6666666666667" y="122" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">08:00</text><text x="661.0" y="122" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">12:00</text><text x="853.5" y="122" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">18:00</text><text x="1046.0" y="122" font-family="Arial,sans-serif" font-size="16" fill="#c1b6d0">24:00</text><text x="32" y="168" font-family="Arial,sans-serif" font-size="22" fill="#7fe0c0">1. Day desk</text><rect x="290" y="141" width="770" height="40" rx="0" fill="#30263d" stroke="none"/><rect x="546.6666666666667" y="141" width="320.8333333333333" height="40" rx="0" fill="#77bbff" stroke="none"/><text x="558.6666666666667" y="168" font-family="Arial,sans-serif" font-size="18" fill="#181324">08:00–18:00 UTC</text><text x="32" y="238" font-family="Arial,sans-serif" font-size="22" fill="#7fe0c0">2. Always fallback</text><rect x="290" y="211" width="770" height="40" rx="0" fill="#ffdc3c" stroke="none"/><text x="302" y="238" font-family="Arial,sans-serif" font-size="18" fill="#181324">Chosen only when route 1 does not match</text><text x="32" y="300" font-family="Arial,sans-serif" font-size="21" fill="#f4edf9">Priority: first matching route wins. An Always route in position 1 hides later routes.</text><text x="32" y="366" font-family="Arial,sans-serif" font-size="22" fill="#7fe0c0">30-minute periods</text><rect x="290.0" y="335" width="248.66666666666669" height="55" rx="5" fill="#514162" stroke="none"/><text x="308.0" y="371" font-family="Arial,sans-serif" font-size="22" fill="#f4edf9">12:00–12:29</text><rect x="546.6666666666667" y="335" width="248.66666666666669" height="55" rx="5" fill="#514162" stroke="none"/><text x="564.6666666666667" y="371" font-family="Arial,sans-serif" font-size="22" fill="#f4edf9">12:30–12:59</text><rect x="803.3333333333334" y="335" width="248.66666666666669" height="55" rx="5" fill="#514162" stroke="none"/><text x="821.3333333333334" y="371" font-family="Arial,sans-serif" font-size="22" fill="#f4edf9">13:00–13:29</text><text x="32" y="431" font-family="Arial,sans-serif" font-size="20" fill="#f4edf9">Save at 12:17: the current period may start immediately if its round is not complete.</text><text x="32" y="472" font-family="Arial,sans-serif" font-size="20" fill="#f4edf9">It is not “wait 30 minutes after Save.” One completed round is recorded per period.</text><text x="32" y="534" font-family="Arial,sans-serif" font-size="18" fill="#c1b6d0">Overnight example: 22:00 → 06:00 spans midnight. Equal start/end times are invalid.</text></svg>
