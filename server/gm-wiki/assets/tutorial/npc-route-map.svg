AUSE AT A DESTINATION</text><text x="532" y="352" font-family="Arial,sans-serif" font-size="18" fill="#f4edf9">A wait belongs to a waypoint, not a corridor.</text><text x="532" y="413" font-family="Arial,sans-serif" font-size="20" fill="#7fe0c0">3: CONTINUE OR TURN AROUND</text><text x="532" y="443" font-family="Arial,sans-serif" font-size="18" fill="#f4edf9">Movement mode chooses what happens next.</text><text x="32" y="532" font-family="Arial,sans-serif" font-size="18" fill="#c1b6d0">Dashed = approach from home     •     Numbers = clicked destinations     •     Solid = route preview</text></svg>
