<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,"><title>LiDollQuest Map Editor</title>
<style>
:root{color-scheme:dark;--bg:#160f1c;--panel:#221730;--edge:#3a2a4d;--ink:#f2e9f7;--dim:#a894b8;--rose:#ff8fc4;--mint:#7fe0c0;--red:#ff7b8f;--gold:#ffdc3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}button,input,select,textarea{font:inherit;background:#1b1226;color:var(--ink);border:1px solid var(--edge);border-radius:6px;padding:5px 8px}button{cursor:pointer}button:hover{border-color:var(--rose)}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--rose);color:#2a0d1c}button.active{border-color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint)}a{color:var(--mint)}
header{padding:8px 14px;background:var(--panel);display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--edge)}h1{font-size:17px;color:var(--rose);margin:0 12px 0 0}h2{font-size:14px;color:var(--rose);margin:12px 0 6px}h2:first-child{margin-top:0}
#status{padding:4px 14px;min-height:26px;color:var(--mint);font-size:13px}#status.error{color:var(--red)}
main{display:grid;grid-template-columns:250px minmax(300px,1fr) 320px;flex:1;min-height:0}aside{background:var(--panel);padding:10px 12px;overflow:auto;border:1px solid var(--edge);font-size:13px}aside label{display:block;margin:6px 0;color:var(--dim)}aside label input:not([type=checkbox]),aside label select{display:block;width:100%;color:var(--ink)}aside label input[type=checkbox]{margin-right:6px}
#stage{position:relative;overflow:hidden;background:#0d0812;cursor:crosshair;touch-action:none}#map{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;transform-origin:0 0}
#palette button{display:block;width:100%;text-align:left;margin:3px 0}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.note{color:var(--dim);font-size:12px}.music-zone{border:1px solid var(--edge);border-radius:8px;padding:8px}.music-line{display:flex;gap:6px;align-items:center;margin:4px 0}.music-line select{flex:1;min-width:0}.music-slot{width:52px;color:var(--dim);font-size:12px}.music-zone button.go{background:var(--rose);color:#2a0d1c}.mono{font-family:Consolas,monospace;font-size:12px}
#readout{background:#1b1226;border:1px solid var(--edge);border-radius:6px;padding:6px 8px;min-height:84px;white-space:pre-wrap}#pending li{margin:3px 0}#pending button{padding:0 6px;margin-left:4px}.swatch{display:inline-block;width:32px;height:32px;image-rendering:pixelated;border:1px solid var(--edge);margin:1px;cursor:pointer;background:#000}.swatch.active{outline:2px solid var(--mint)}#swatches{display:flex;flex-wrap:wrap;max-height:200px;overflow:auto}
#spritePreview canvas{image-rendering:pixelated;border:1px solid var(--edge);background:#000}#spriteList{max-height:180px;overflow:auto;border:1px solid var(--edge);border-radius:6px}#spriteList button{display:block;width:100%;text-align:left;border:0;border-radius:0;background:transparent}#spriteList button.active{background:#3a2a4d}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:10px;max-width:520px}
</style></head><body>
<header><h1>Map Editor</h1><select id="zone" aria-label="Zone"></select><button id="refresh">Refresh</button><label><input type="checkbox" id="auto" checked> auto-refresh 5s</label><span id="badge" class="mono"></span><span style="flex:1"></span><select id="scale" aria-label="PNG scale"><option value="32">PNG 32 px/tile</option><option value="16">PNG 16 px/tile</option><option value="8">PNG 8 px/tile</option></select><button id="download">Download painted PNG</button><button id="downloadWorld" title="Paint every overworld, dungeon and hub on one picture, placed by their gates and doors (8 px per tile)">Download world PNG</button><a href="/gm" target="lidollquest-gm">Advanced GM tools</a><a href="/gm/flow-editor" target="lidollquest-flow">Story Workshop</a><a href="/gm/wiki/#maps" target="lidollquest-gm-wiki" rel="noopener">GM wiki: maps</a></header>
<header><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="fit">Fit</button><span class="note">Wheel zooms · right-drag or Space-drag pans · click uses the tool</span><span style="flex:1"></span><label><input type="checkbox" id="showGrid"> grid</label><label><input type="checkbox" id="showReach"> reachability</label><label><input type="checkbox" id="showSafe" checked> safe rooms</label><label><input type="checkbox" id="showLayers" checked> biome layers</label><label><input type="checkbox" id="showPlayers" checked> players</label><label><input type="checkbox" id="showRoutes" checked> NPC routes</label><button id="regenerate" hidden>Regenerate…</button><button id="cancel" hidden>Cancel regeneration</button><button id="lock" hidden>Lock layout</button></header>
<div id="status" role="status" aria-live="polite">Loading the authenticated map editor…</div>
<main>
<aside id="tools"><h2>Tools</h2><div id="palette"></div><div id="toolOptions"></div></aside>
<div id="stage" tabindex="0" aria-label="Zone canvas"><canvas id="map"></canvas></div>
<aside id="inspector"><h2>Under the cursor</h2><div id="readout" class="mono"></div><h2>Pending changes</h2><ul id="pending"></ul><div class="row"><button id="apply" class="primary" disabled>Apply changes</button><button id="undo" disabled>Undo</button><button id="redo" disabled>Redo</button><button id="discard" disabled>Discard</button></div><h2>Patch layer</h2><div id="patchInfo" class="note"></div><div id="history"></div><h2>Zone music</h2><div id="zoneMusic"><p class="note">Pick a zone.</p></div></aside>
</main>
<dialog id="modal"><div id="modalBody"></div><div class="row" style="margin-top:10px"><button id="modalOk" class="primary">Confirm</button><button id="modalCancel">Cancel</button></div></dialog>
<script>/* TILE_PAINTER */</script><script>/* MUSIC_WIDGET */</script><script>/* MAP_EDITOR */</script></body></html>
